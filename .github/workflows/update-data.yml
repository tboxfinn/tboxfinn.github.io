# ─────────────────────────────────────────────────────────────
# Actualización automática de datos del portfolio
# - Se ejecuta el día 1 de cada mes a las 05:23 UTC y manualmente
#   (botón "Run workflow" en Actions → Update portfolio data).
# - Actualiza games.json (itch.io) y assets-data.js (Asset Store)
#   y hace commit de los cambios → GitHub Pages los publica solo.
# ─────────────────────────────────────────────────────────────
name: Update portfolio data

on:
  schedule:
    - cron: '23 5 1 * *'   # día 1 de cada mes, 05:23 UTC
  workflow_dispatch:      # permite ejecutarlo a mano desde GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (puppeteer + Chrome)
        run: npm ci

      - name: Fetch Unity Asset Store assets
        run: node fetch-unity-assets.js
        continue-on-error: true

      - name: Fetch itch.io games
        run: node fetch-itch-games.js
        env:
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
        continue-on-error: true

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json assets-data.js
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos — nada que publicar."
          else
            git commit -m "chore: actualizar datos del portfolio (assets + juegos)"
            git push
          fi
